name: fofo_onboarding
description: Field onboarding app for Dava India FOFO and COCO stores.
publish_to: 'none'
version: 1.2.3+15

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  material_ui: ^1.11.0
  clock: ^1.1.3
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  file_picker: ^13.3.3
  path_provider: ^2.1.6
  google_maps_flutter: ^2.19.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/brand/
    - assets/emoji/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
