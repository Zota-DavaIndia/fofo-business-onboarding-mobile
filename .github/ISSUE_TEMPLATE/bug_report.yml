name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a lead
        2. Tap Check in
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Add a screenshot if you can. Blur any partner details.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the Profile screen
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
