name: Release

# Publishes a signed APK when the version in pubspec.yaml changes on main.
# The app's updater reads version.json from the latest release. Builds use
# the API_BASE_URL repository variable, or the staging API from
# env/staging.json until that variable is set.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          full=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)
          name=${full%%+*}
          build=${full##*+}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$name is already released. Bump the version in pubspec.yaml to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            echo "api=${{ vars.API_BASE_URL }}" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "api=$(jq -r .API_BASE_URL env/staging.json)" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.skip == 'false'
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        if: steps.version.outputs.skip == 'false'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=${{ steps.version.outputs.env }} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.name }} \
            --dart-define=API_BASE_URL=${{ steps.version.outputs.api }}

      - name: Verify signature
        if: steps.version.outputs.skip == 'false'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=Masud Shafin Ahmed"

      - name: Prepare release files
        if: steps.version.outputs.skip == 'false'
        run: |
          tag=${{ steps.version.outputs.tag }}
          apk=davaindia-ff-android.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          sha=$(sha256sum "dist/$apk" | awk '{print $1}')
          jq -n \
            --arg version "${{ steps.version.outputs.name }}" \
            --argjson build ${{ steps.version.outputs.build }} \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg apk_url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$apk" \
            --arg sha256 "$sha" \
            --argjson size "$(stat -c %s "dist/$apk")" \
            '{version: $version, build: $build, released_at: $released_at, apk_url: $apk_url, sha256: $sha256, size: $size}' \
            > dist/version.json
          (cd dist && sha256sum "$apk" version.json > SHA256SUMS)
          cat dist/version.json

      - name: Publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
